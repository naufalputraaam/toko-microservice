# API Gateway: satu pintu masuk (port 80 di container, 8080 di laptop).
# Request diteruskan ke service yang tepat berdasarkan awalan URL.
# Endpoint /internal/... TIDAK dibuka di sini (hanya untuk komunikasi antar-service).

# Docker DNS, agar gateway tetap jalan walau ada service yang mati.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # Header standar yang diteruskan ke service
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Authorization     $http_authorization;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    # Jika service tujuan mati (nginx tidak bisa terhubung), kembalikan JSON 503
    error_page 502 503 504 = @service_down;
    location @service_down {
        default_type application/json;
        return 503 '{"error":"service sedang tidak tersedia"}';
    }

    location /katalog {
        set $katalog http://katalog-service:8080;
        proxy_pass $katalog;
    }
    location /pelanggan {
        set $pelanggan http://pelanggan-service:8080;
        proxy_pass $pelanggan;
    }
    location /order {
        set $order http://order-service:8080;
        proxy_pass $order;
    }
    location /pembayaran {
        set $pembayaran http://pembayaran-service:8080;
        proxy_pass $pembayaran;
    }

    # Endpoint internal tidak boleh diakses dari luar
    location /internal/ {
        default_type application/json;
        return 403 '{"error":"endpoint internal tidak dapat diakses dari luar"}';
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # Dashboard: / = toko, /admin.html = dashboard admin
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
